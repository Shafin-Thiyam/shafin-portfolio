version: "3.9"

services:
  db:
    image: postgres:17

    container_name: portfolio-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: